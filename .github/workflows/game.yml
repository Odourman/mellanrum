name: MELLANRUM full-game ROM checks
on:
  pull_request:
  push:
    branches: [main, 'romdev/**']
  workflow_dispatch:
jobs:
  game-build-and-model:
    # Issue26 uses the strict real-F6 workflow; this historical job rebuilds
    # 4K Issue15 source and must not run against an unrelated 16K candidate.
    if: ${{ !startsWith(github.ref, 'refs/heads/romdev/issue26-') && !startsWith(github.head_ref, 'romdev/issue26-') && !startsWith(github.ref, 'refs/heads/romdev/issue32-') && !startsWith(github.head_ref, 'romdev/issue32-') && !startsWith(github.ref, 'refs/heads/romdev/mainii-') && !startsWith(github.ref, 'refs/heads/romdev/issue43-') && !startsWith(github.head_ref, 'romdev/issue43-') && !startsWith(github.ref, 'refs/heads/romdev/issue46-') && !startsWith(github.head_ref, 'romdev/issue46-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm
      - name: Check reproducible Issue15 overlay against pinned source art and reference
        run: |
          python3 build_issue15.py
          git diff --exit-code -- rom/src/main.asm rom/src/data.inc
          (cd reference && python3 -m unittest -q test_engine.py)
      - name: Build original Atari 2600 4K ROM with real DASM
        run: |
          mkdir -p build
          dasm rom/src/main.asm -f3 -obuild/mellanrum_ntsc.bin -lbuild/mellanrum_ntsc.lst -sbuild/mellanrum_ntsc.sym
          test "$(wc -c < build/mellanrum_ntsc.bin)" -eq 4096
          python3 scripts/check_rom.py build/mellanrum_ntsc.bin
      - name: Cross-check machine code with independent subset assembler
        run: |
          cp build/mellanrum_ntsc.bin build/dasm.bin
          python3 scripts/assemble_check.py rom/src/main.asm -o build/mellanrum_ntsc.bin
          cmp build/dasm.bin build/mellanrum_ntsc.bin
          sha256sum build/dasm.bin build/mellanrum_ntsc.bin
      - name: Compare running 6507 machine code states against V5.1 Python oracle
        run: python3 scripts/check_rom_vs_model.py
      - name: Verify dynamic playfield, joystick and 262-line developer timing
        run: |
          python3 scripts/check_playfield.py
          python3 scripts/check_input.py
          python3 scripts/check_hardware_ab.py
          python3 scripts/check_frame_budget.py
      - name: Title exact MELLANRUM and Presence no-physics-change developer tests
        run: python3 scripts/check_title_presence.py
      - name: Frame-level CPU/RIOT/WSYNC development trace
        run: |
          python3 scripts/cpu_trace.py > build/cpu_trace.txt
          cat build/cpu_trace.txt
      - name: Create SHA-256 checksums
        run: |
          (cd build && sha256sum mell*bin > SHA256SUMS)
          echo 'DASM_BUILD_PASS and MODEL_CPU_TRACE_PASS do not establish Stella or physical-hardware verification.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload ROM and developer verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: mell-full-game-developer-build-not-independent-verified
          path: |
            build/mellanrum_ntsc.bin
            build/mellanrum_ntsc.lst
            build/mellanrum_ntsc.sym
            build/cpu_trace.txt
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
